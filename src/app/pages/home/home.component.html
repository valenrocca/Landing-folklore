<div class="landing">
  <section class="page hero-section">
    <div class="page__content hero">
      <div class="hero__body">
        <img
          src="assets/images/logo.png"
          alt="República Folklore — 21 y 22 de noviembre 2026, Parque de la Ciudad"
          class="hero__logo"
        />

        @if (!showRegister && !registrationComplete) {
          <div class="hero__actions">
            <button
              type="button"
              class="btn-hero btn-hero--register"
              (click)="openRegister()"
            >
              Registrate
            </button>
            <a href="#" class="btn-hero btn-hero--tickets">Comprar entradas</a>
          </div>
        }
      </div>
    </div>
  </section>

  <section class="lineup" aria-label="Line up">
    <img
      src="assets/images/RF_LINEUP_WEB.jpg.jpeg"
      alt="Line up República Folklore"
      class="lineup__img"
    />
  </section>

  <section id="manifiesto" class="manifesto" aria-label="Manifiesto">
    <div class="manifesto__visual manifesto__visual--mobile">
      <img
        src="assets/images/Fondo Mobile.svg"
        alt=""
        class="manifesto__bg"
        aria-hidden="true"
      />
      <img
        src="assets/images/Manifiesto Mobile.svg"
        alt="Manifiesto República Folklore"
        class="manifesto__text"
      />
    </div>

    <div class="manifesto__visual manifesto__visual--desktop">
      <img
        src="assets/images/Fondo Desktop.svg"
        alt=""
        class="manifesto__bg"
        aria-hidden="true"
      />
      <img
        src="assets/images/Manifiesto Desktop.svg"
        alt="Manifiesto República Folklore"
        class="manifesto__text"
      />
    </div>
  </section>

  <app-footer />

  <a
    href="https://www.youtube.com/watch?v=7tCV6B5C6SE"
    target="_blank"
    rel="noopener noreferrer"
    class="home__video-cta"
    aria-label="Ver video"
  >
    <img
      src="assets/BOTONES/BOTON%20VER%20COMPLETO.jpg.jpeg"
      alt="Ver video"
      class="home__video-cta-img"
    />
  </a>

  @if (showRegister) {
    <app-register-modal (registrationSuccess)="onRegistrationSuccess()" />
  }
</div>
